<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unidade · Camada de Saúde CulturaEduca</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="facility-page">
  <nav class="topbar">
    <a id="back" href="index.html" data-i18n="page.back">← Voltar ao mapa</a>
    <div class="topbar-right">
      <span class="brand" data-i18n="brand">CulturaEduca · Camada de saúde</span>
      <div class="lang-switch" role="group" data-i18n-aria="lang.label">
        <button type="button" data-lang="pt">PT</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </nav>

  <main class="page">
    <div id="facility-root"><p class="hint" data-i18n="page.loading">Carregando unidade…</p></div>

    <section id="surroundings" class="surroundings" hidden>
      <h2 data-i18n="sur.title">Entorno</h2>
      <p id="location-line" class="hint"></p>

      <div class="controls">
        <label for="radius" data-i18n="sur.radius">Raio ao redor da unidade</label>
        <input id="radius" type="range" min="250" max="5000" step="250" value="1000">
        <output id="radius-value" for="radius">1,0 km</output>
        <label class="control-option">
          <input id="public-only" type="checkbox">
          <span data-i18n="sur.publicOnly">Considerar apenas unidades públicas ou com vínculo com o SUS</span>
        </label>
      </div>

      <section id="narrative" class="card narrative" aria-live="polite" hidden></section>

      <div id="surroundings-body" class="surroundings-body">
        <div id="tiles"></div>

        <div class="split">
          <div class="card">
            <div class="card-head">
              <h3 data-i18n="sur.mapTitle">Setores censitários dentro do raio</h3>
              <label class="visually-hidden" for="indicator" data-i18n="sur.indicator">Indicador exibido no mapa</label>
              <select id="indicator"></select>
            </div>
            <div id="mini-map" class="mini-map"></div>
            <div id="map-legend" class="ramp-legend"></div>
            <p id="map-hint" class="hint"></p>
          </div>

          <div class="card" id="t-environment"></div>
        </div>

        <div class="split">
          <div class="card" id="t-respiratory"></div>
          <div class="card" id="t-access"></div>
        </div>

        <div class="split">
          <div class="card" id="t-maternal"></div>
          <div class="card" id="t-mortality"></div>
        </div>

        <div class="split">
          <div class="card" id="nearby-types"></div>
          <div class="card" id="nearby-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/facility.js"></script>
</body>
</html>
